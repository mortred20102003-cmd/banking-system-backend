spring:
  application:
    name: Banking_System

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking_system_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BankingHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

app:
  jwt:
    secret: ${JWT_SECRET:default_dev_only_secret_change_me_please_32chars_min}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: Banking_System
  super-admin:
    username: ${SUPER_ADMIN_USERNAME:MikeyD}
    email: ${SUPER_ADMIN_EMAIL:mikeyD@bank.com}
    password: ${SUPER_ADMIN_PASSWORD:}
  account:
    number-prefix: ${ACCOUNT_NUMBER_PREFIX:10}
    number-length: ${ACCOUNT_NUMBER_LENGTH:10}

logging:
  level:
    root: INFO
    com.bank.bankingsystem: DEBUG
    org.springframework.jdbc.core: DEBUG
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
