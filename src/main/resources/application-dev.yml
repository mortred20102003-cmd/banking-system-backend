spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking_system_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

logging:
  level:
    com.bank.bankingsystem: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

app:
  jwt:
    secret: ${JWT_SECRET:dev_only_secret_change_me_please_32_chars_minimum_ok}