<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banking System — Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/admin.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-view">
  <div class="login-card">
    <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
      <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#a855f7"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mg)"/>
      <path d="M14 48 V18 L32 36 L50 18 V48" fill="none" stroke="#0b1220"
            stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Banking System</h1>
    <p class="subtitle">Admin Console</p>

    <form id="login-form" autocomplete="on">
      <label for="login-identifier">Username or Email</label>
      <input id="login-identifier" type="text" required autocomplete="username">

      <label for="login-password">Password</label>
      <div class="pw-wrap">
        <input id="login-password" type="password" required autocomplete="current-password">
        <button type="button" class="eye" data-target="login-password" tabindex="-1">👁</button>
      </div>

      <button type="submit" id="login-btn">Sign in</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="22" height="22" style="vertical-align:middle;margin-right:6px">
        <defs><linearGradient id="mg2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a855f7"/>
        </linearGradient></defs>
        <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mg2)"/>
        <path d="M14 48 V18 L32 36 L50 18 V48" fill="none" stroke="#0b1220"
              stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Banking System <span class="tag">ADMIN</span>
    </div>
    <div class="who">
      <button id="theme-toggle" class="btn-ghost" type="button">☀</button>
      <span id="who-username">—</span>
      <button id="logout-btn" class="btn-ghost" type="button">Log out</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="accounts">Accounts</button>
    <button class="tab" data-tab="customers">Customers</button>
    <button class="tab" data-tab="profile">Profile</button>
  </nav>

  <main>
    <section id="tab-accounts" class="tab-panel">
      <div class="stats" id="stats-strip" style="margin-bottom:16px">
        <div class="stat"><div class="stat-num" id="stat-users">—</div><div class="stat-label">Users</div></div>
        <div class="stat"><div class="stat-num" id="stat-accounts">—</div><div class="stat-label">Accounts</div></div>
        <div class="stat"><div class="stat-num" id="stat-balance">—</div><div class="stat-label">Total Deposits</div></div>
      </div>
      <div class="panel-head">
        <h2>All Accounts</h2>
        <button class="btn" type="button" onclick="App.loadAccounts()">Refresh</button>
      </div>
      <table class="grid">
        <thead><tr><th>ID</th><th>Number</th><th>Owner</th><th>Type</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="accounts-body"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table>
    </section>

    <section id="tab-customers" class="tab-panel hidden">
      <div class="panel-head">
        <h2>All Customers</h2>
        <button class="btn" type="button" onclick="App.loadCustomers()">Refresh</button>
      </div>
      <table class="grid">
        <thead><tr><th>ID</th><th>User</th><th>Name</th><th>Phone</th><th>Joined</th><th>Actions</th></tr></thead>
        <tbody id="customers-body"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </section>

    <section id="tab-profile" class="tab-panel hidden">
      <h2>My Profile</h2>
      <div class="card" style="background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px">
        <div id="profile-info">Loading…</div>
      </div>
    </section>
  </main>
</div>

<!-- CUSTOMER DETAIL DRAWER -->
<div id="cust-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="cust-title">Customer</h3>
      <button class="btn-ghost" type="button" onclick="App.closeCustomer()">Close</button>
    </div>
    <div id="cust-content">Loading…</div>
  </div>
</div>

<!-- ACCOUNT HISTORY MODAL -->
<div id="acct-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="acct-title">Account History</h3>
      <button class="btn-ghost" type="button" onclick="App.closeAcctModal()">Close</button>
    </div>
    <div id="acct-content">Loading…</div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/config.js"></script>
<script src="/admin.js"></script>
</body>
</html>
